
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Usia</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #fff0f5;
    }

    .container {
        width: 350px;
        margin: 80px auto;
        padding: 25px;
        background-color: white;
        border: 2px solid #e88bb8;
        border-radius: 10px;
    }

    h2 {
        text-align: center;
        color: #d63384;
    }

    label {
        display: inline-block;
        width: 60px;
        margin-top: 15px;
        color: #a52a65;
    }

    input {
        width: 230px;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #e88bb8;
        border-radius: 5px;
    }

    input:focus {
        outline: 2px solid #f3b5d2;
    }

    button {
        margin-top: 20px;
        padding: 8px 15px;
        background-color: #e88bb8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #d63384;
    }

    #hasil {
        margin-top: 20px;
        padding: 10px;
        background-color: #fff0f5;
        border: 1px solid #f3b5d2;
        border-radius: 5px;
    }
</style>


    <script>
        $(document).ready(function() {

            $("#proses").click(function() {
                var nama = $("#nama").val().trim();
                var usia = $("#usia").val();

                if (nama === "" || usia === "") {
                    $("#hasil").html("Nama dan usia harus diisi.");
                } else if (Number(usia) <= 0) {
                    $("#hasil").html("Usia harus lebih dari 0.");
                } else if (Number(usia) > 27) {
                    $("#hasil").html("Hello, " + $("<div>").text(nama).html() +
                        "! Anda berusia " + usia +
                        " tahun. Anda BOLEH MASUK.");
                } else {
                    $("#hasil").html("Maaf, " + $("<div>").text(nama).html() +
                        ". Usia Anda " + usia +
                        " tahun. Anda TIDAK BOLEH MASUK.");
                }
            });

            $("#clear").click(function() {
                $("#nama").val("");
                $("#usia").val("");
                $("#hasil").html("");
            });

        });
    </script>
</head>

<body>

    <div class="container">
    <h2>Registrasi Pengunjung</h2>

    <label for="nama">Nama:</label>
    <input type="text" id="nama" placeholder="Masukkan nama">
    <br>

    <label for="usia">Usia:</label>
    <input type="number" id="usia" placeholder="Masukkan usia" min="1">
    <br>

    <button type="button" id="proses">PROSES</button>
    <button type="button" id="clear">CLEAR</button>
    <div id="hasil"></div>

    </div>

</body>
</html>
